name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf rpm

      - name: install node dependencies
        run: npm ci

      - name: build Deno sidecar (linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run build:deno:linux

      - name: build Deno sidecar (windows)
        if: matrix.platform == 'windows-latest'
        run: npm run build:deno:win

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Explicit per-host bundle list: on Linux the bundler does NOT skip
          # the nsis target (only msi/deb/... are cfg-gated) and would attempt
          # a cargo-xwin cross build; on Windows, deb/rpm/appimage are
          # skipped anyway — pinning the list makes both legs deterministic.
          args: ${{ matrix.platform == 'ubuntu-22.04' && '--bundles deb,rpm,appimage' || '--bundles nsis,msi' }}
          tagName: v__VERSION__
          releaseName: 'VelocityDL v__VERSION__'
          releaseBody: 'VelocityDL desktop release for Windows and Linux.'
          releaseDraft: false
          prerelease: false

      # Portable .tar.gz for Arch / generic Linux (Tauri has no pacman target).
      # Packs target/release/velocity-dl + the deno-engine sidecar.
      - name: build portable tarball (linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/make-linux-tar.sh

      - name: attach tarball to release (tags only)
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" release/VelocityDL-*.tar.gz release/VelocityDL-*.tar.gz.sha256 --clobber

      # Publish a .sha256 sidecar next to EVERY installer asset so the
      # in-app updater can verify installer integrity before launching it
      # (see src-deno/commands/appUpdate.ts).
      - name: generate installer checksums (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash # windows-latest defaults to pwsh: no sha256sum/for/awk
        run: |
          mkdir -p checksums
          for f in src-tauri/target/release/bundle/nsis/*.exe \
                   src-tauri/target/release/bundle/msi/*.msi \
                   src-tauri/target/release/bundle/appimage/*.AppImage \
                   src-tauri/target/release/bundle/deb/*.deb \
                   src-tauri/target/release/bundle/rpm/*.rpm \
                   src-tauri/target/release/bundle/dmg/*.dmg; do
            [ -e "$f" ] || continue
            base="${f##*/}"
            sha256sum "$f" | awk -v b="$base" '{print $1 "  " b}' > "checksums/${base}.sha256"
            echo "checksummed: $base"
          done

      - name: upload installer checksums to release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash # windows-latest defaults to pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=()
          for f in checksums/*.sha256; do files+=("$f"); done
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            echo "No checksums generated in this leg — skipping."
          fi
